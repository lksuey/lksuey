<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="900" height="250" fill="#1A1A19"/>
<line x1="0" y1="0.5" x2="900" y2="0.5" stroke="#F3F2EE" stroke-width="1"/>
<line x1="0" y1="249.5" x2="900" y2="249.5" stroke="#3B3B37" stroke-width="1"/>
<line x1="450.0" y1="22" x2="450.0" y2="228" stroke="#3B3B37" stroke-width="1"/>
<line x1="24" y1="125.0" x2="876" y2="125.0" stroke="#3B3B37" stroke-width="1"/>
<text x="24.0" y="40.0" font-size="11" font-weight="700" fill="#9CC98A" letter-spacing="2" text-anchor="start">01</text>
<text x="56.0" y="40.0" font-size="15" font-weight="600" fill="#F3F2EE" text-anchor="start">I start from the decision.</text>
<text x="56.0" y="68.0" font-size="13" font-weight="400" fill="#A5A69C" text-anchor="start">Before building a report I ask who will act on it</text>
<text x="56.0" y="88.0" font-size="13" font-weight="400" fill="#A5A69C" text-anchor="start">and what they would do differently.</text>
<text x="474.0" y="40.0" font-size="11" font-weight="700" fill="#9CC98A" letter-spacing="2" text-anchor="start">02</text>
<text x="506.0" y="40.0" font-size="15" font-weight="600" fill="#F3F2EE" text-anchor="start">I automate what repeats.</text>
<text x="506.0" y="68.0" font-size="13" font-weight="400" fill="#A5A69C" text-anchor="start">If I do something three times, it becomes a script</text>
<text x="506.0" y="88.0" font-size="13" font-weight="400" fill="#A5A69C" text-anchor="start">with logs and a way to fail loudly.</text>
<text x="24.0" y="165.0" font-size="11" font-weight="700" fill="#9CC98A" letter-spacing="2" text-anchor="start">03</text>
<text x="56.0" y="165.0" font-size="15" font-weight="600" fill="#F3F2EE" text-anchor="start">I test the data, not only the code.</text>
<text x="56.0" y="193.0" font-size="13" font-weight="400" fill="#A5A69C" text-anchor="start">Row counts, keys and reconciliations run before</text>
<text x="56.0" y="213.0" font-size="13" font-weight="400" fill="#A5A69C" text-anchor="start">anything reaches a dashboard.</text>
<text x="474.0" y="165.0" font-size="11" font-weight="700" fill="#9CC98A" letter-spacing="2" text-anchor="start">04</text>
<text x="506.0" y="165.0" font-size="15" font-weight="600" fill="#F3F2EE" text-anchor="start">I say what I don't know.</text>
<text x="506.0" y="193.0" font-size="13" font-weight="400" fill="#A5A69C" text-anchor="start">I prefer a short "not sure yet, here is how I'll</text>
<text x="506.0" y="213.0" font-size="13" font-weight="400" fill="#A5A69C" text-anchor="start">check" over a confident guess.</text>
</svg>
